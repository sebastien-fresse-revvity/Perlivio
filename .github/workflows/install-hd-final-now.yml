name: Install final Perlivio HD imagery

on:
  push:
    branches: [hd-images-final-now]
    paths:
      - '.hd-images-final-now/READY'
      - '.github/workflows/install-hd-final-now.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate final WebP files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, json, os, re, urllib.request

          root = Path('.hd-images-final-now')
          out = Path('/tmp/perlivio-images')
          out.mkdir(parents=True, exist_ok=True)
          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']

          def api_blob(sha):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  obj = json.load(response)
              return base64.b64decode(obj['content'])

          def decode_text_parts(shas):
              raw = b''.join(api_blob(sha) for sha in shas)
              raw = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
              raw += b'=' * ((4 - len(raw) % 4) % 4)
              return base64.b64decode(raw, validate=False)

          def decode_staging(path):
              raw = (root / path).read_bytes()
              raw = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
              raw += b'=' * ((4 - len(raw) % 4) % 4)
              return base64.b64decode(raw, validate=False)

          def validate(name, data):
              if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{name}: invalid WebP header')
              declared = int.from_bytes(data[4:8], 'little') + 8
              if len(data) != declared:
                  raise SystemExit(f'{name}: truncated WebP ({len(data)} != {declared})')
              (out / f'{name}.webp').write_bytes(data)
              print(f'{name}: {len(data)} bytes OK')

          validate('packshot-essentiel', decode_staging('packshot-essentiel.b64'))
          validate('packshot-metal', decode_staging('packshot-metal.b64'))
          validate('packshot-inox', decode_staging('packshot-inox.b64'))
          validate('packshot-argent', decode_staging('packshot-argent.b64'))

          validate('packshot-reserve', api_blob('868c10202aabac5ee3770a19e923f7e9e58e48e5'))
          validate('packshot-signature', decode_text_parts([
              '079f7177c7cea4bfcdab5b9b4f0f1879f778f460',
              '6126901796eaab2addb3a30e115fb8ed2d0046ab',
          ]))
          validate('hero-lifestyle', decode_text_parts([
              '97b47af43e8ac1a8a3b5a4de41cd87d6c768c5d0',
              'bc8297d4e83b704acfedc84337a3f72236774f6f',
          ]))
          validate('stones-catalogue', decode_text_parts([
              'a9e9934c3ede541bca2c6df62564422362d52b05',
              'b043bb85e37e90c3693b37ae424733e6a1a78032',
          ]))
          PY

      - name: Publish WebP files on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          src=/tmp/perlivio-images
          cp "$src/hero-lifestyle.webp" assets/media/hero-lifestyle.webp
          cp "$src/hero-lifestyle.webp" assets/media/collections-overview.webp
          cp "$src/packshot-essentiel.webp" assets/media/packshot-essentiel.webp
          cp "$src/packshot-essentiel.webp" assets/media/bracelet-single-b.webp
          cp "$src/packshot-metal.webp" assets/media/packshot-metal.webp
          cp "$src/packshot-metal.webp" assets/media/bracelet-single-e.webp
          cp "$src/packshot-inox.webp" assets/media/packshot-inox.webp
          cp "$src/packshot-argent.webp" assets/media/packshot-argent.webp
          cp "$src/packshot-argent.webp" assets/media/bracelet-single-a.webp
          cp "$src/packshot-signature.webp" assets/media/packshot-signature.webp
          cp "$src/packshot-signature.webp" assets/media/bracelet-single-d.webp
          cp "$src/packshot-reserve.webp" assets/media/packshot-reserve.webp
          cp "$src/packshot-reserve.webp" assets/media/reserve-lifestyle.webp
          cp "$src/stones-catalogue.webp" assets/media/stones-catalogue.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="assets/media/packshot-signature.webp"'
          new = 'src="assets/media/hero-lifestyle.webp"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Hero image reference not found')
          p.write_text(s, encoding='utf-8')
          PY
          rm -rf .hd-images-upload .hd-images-upload-v2 .hd-images-direct-v3 .hd-images-source-final .hd-images-final-now
          rm -f .github/workflows/upgrade-hd-images.yml .github/workflows/upgrade-hd-images-v2.yml .github/workflows/install-hd-binary.yml .github/workflows/install-hd-source.yml .github/workflows/install-hd-final-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix: publish final high-quality Perlivio imagery'
          git push origin HEAD:main
