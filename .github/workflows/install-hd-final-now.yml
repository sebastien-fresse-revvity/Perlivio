name: Install final Perlivio HD imagery

on:
  push:
    branches: [hd-images-final-now]
    paths:
      - '.hd-images-final-now/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode final WebP files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/perlivio-images
          base64 --decode .hd-images-final-now/packshot-essentiel.b64 > /tmp/perlivio-images/packshot-essentiel.webp
          base64 --decode .hd-images-final-now/packshot-metal.b64 > /tmp/perlivio-images/packshot-metal.webp
          base64 --decode .hd-images-final-now/packshot-inox.b64 > /tmp/perlivio-images/packshot-inox.webp
          base64 --decode .hd-images-final-now/packshot-argent.b64 > /tmp/perlivio-images/packshot-argent.webp
          cat .hd-images-final-now/reserve-0.b64 .hd-images-final-now/reserve-1.b64 | base64 --decode > /tmp/perlivio-images/packshot-reserve.webp
          cat .hd-images-final-now/signature-0.b64 .hd-images-final-now/signature-1.b64 | base64 --decode > /tmp/perlivio-images/packshot-signature.webp
          cat .hd-images-final-now/hero-0.b64 .hd-images-final-now/hero-1.b64 | base64 --decode > /tmp/perlivio-images/hero-lifestyle.webp
          cat .hd-images-final-now/stones-0.b64 .hd-images-final-now/stones-1.b64 | base64 --decode > /tmp/perlivio-images/stones-catalogue.webp
          for f in /tmp/perlivio-images/*.webp; do
            test "$(stat -c%s "$f")" -gt 1000
            file "$f" | grep -Eqi 'Web/P|WebP'
          done

      - name: Publish WebP files on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          src=/tmp/perlivio-images
          cp "$src/hero-lifestyle.webp" assets/media/hero-lifestyle.webp
          cp "$src/hero-lifestyle.webp" assets/media/collections-overview.webp
          cp "$src/packshot-essentiel.webp" assets/media/packshot-essentiel.webp
          cp "$src/packshot-essentiel.webp" assets/media/bracelet-single-b.webp
          cp "$src/packshot-metal.webp" assets/media/packshot-metal.webp
          cp "$src/packshot-metal.webp" assets/media/bracelet-single-e.webp
          cp "$src/packshot-inox.webp" assets/media/packshot-inox.webp
          cp "$src/packshot-argent.webp" assets/media/packshot-argent.webp
          cp "$src/packshot-argent.webp" assets/media/bracelet-single-a.webp
          cp "$src/packshot-signature.webp" assets/media/packshot-signature.webp
          cp "$src/packshot-signature.webp" assets/media/bracelet-single-d.webp
          cp "$src/packshot-reserve.webp" assets/media/packshot-reserve.webp
          cp "$src/packshot-reserve.webp" assets/media/reserve-lifestyle.webp
          cp "$src/stones-catalogue.webp" assets/media/stones-catalogue.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="assets/media/packshot-signature.webp"'
          new = 'src="assets/media/hero-lifestyle.webp"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Hero image reference not found')
          p.write_text(s, encoding='utf-8')
          PY
          rm -rf .hd-images-upload .hd-images-upload-v2 .hd-images-direct-v3 .hd-images-source-final .hd-images-final-now
          rm -f .github/workflows/upgrade-hd-images.yml .github/workflows/upgrade-hd-images-v2.yml .github/workflows/install-hd-binary.yml .github/workflows/install-hd-source.yml .github/workflows/install-hd-final-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix: publish final high-quality Perlivio imagery'
          git push origin HEAD:main
