name: Validate Perlivio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check assets/js/data.js && node --check assets/js/app.js
      - name: Validate pages and local assets
        run: node scripts/validate-site.mjs
      - name: Validate packshot builder
        run: bash -n scripts/build-packshots.sh
