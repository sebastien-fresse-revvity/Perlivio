name: Import Perlivio site

on:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/READY-PR'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .bootstrap -maxdepth 1 -name 'part-*.b64' | wc -l)
          echo "Found $count bootstrap parts"
          test "$count" = "26"
          cat $(find .bootstrap -maxdepth 1 -name 'part-*.b64' | sort) | base64 --decode > /tmp/perlivio-site.tar.xz
          xz -t /tmp/perlivio-site.tar.xz

      - name: Import current Perlivio site
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/perlivio-site.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/import-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Perlivio site v8"
          git push origin HEAD:main
