name: Import Perlivio site

on:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/READY-PR'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fingerprint bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/part-000.b64 > /tmp/p0.bin
          base64 --decode .bootstrap/part-024.b64 > /tmp/p24.bin
          base64 --decode .bootstrap/part-026.b64 > /tmp/p26.bin
          echo "P0=$(sha256sum /tmp/p0.bin | cut -d' ' -f1) SIZE0=$(wc -c < /tmp/p0.bin)"
          echo "P24=$(sha256sum /tmp/p24.bin | cut -d' ' -f1) SIZE24=$(wc -c < /tmp/p24.bin)"
          echo "P26=$(sha256sum /tmp/p26.bin | cut -d' ' -f1) SIZE26=$(wc -c < /tmp/p26.bin)"
          exit 42
