name: Upgrade Perlivio HD images

on:
  pull_request:
    branches: [main]
    paths:
      - '.hd-images-direct/READY'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Decode and verify HD media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/perlivio-hd-media
          for f in hero essentiel argent signature metal inox reserve stones; do
            test -f ".hd-images-direct/$f.b64"
            base64 --decode ".hd-images-direct/$f.b64" > "/tmp/perlivio-hd-media/$f.webp"
          done
          echo 'f51d09cec2b09062781f438a17d3f1d582fd2175d7e8b5f30547a47b2a7840b9  /tmp/perlivio-hd-media/hero.webp' | sha256sum -c -
          echo '2ab6c981a42af25662056db1fa74efb97de6bcbe49025119106cabe68933a743  /tmp/perlivio-hd-media/essentiel.webp' | sha256sum -c -
          echo '5af48067caa34a4addf9ea53876a1b0d586be6ba94fcfe8a44804039c5a955ac  /tmp/perlivio-hd-media/argent.webp' | sha256sum -c -
          echo '1276fb10bc5f52b097dee20f9b4211d8a4a6c3a15ec2cf57cc990b490a95e3da  /tmp/perlivio-hd-media/signature.webp' | sha256sum -c -
          echo 'c1ff6661cea87d5a8b911c4ab9a06971c93641c14eb762dbbbfa058453f195c9  /tmp/perlivio-hd-media/metal.webp' | sha256sum -c -
          echo '49a7222656070827c516fb0b96d368fd2f41151e5db9a708758ad48e2fcab110  /tmp/perlivio-hd-media/inox.webp' | sha256sum -c -
          echo '8afda981ed7062c87c218cf38f4bc35f4713605ce2f01a097d7b3f86bf17821e  /tmp/perlivio-hd-media/reserve.webp' | sha256sum -c -
          echo '90d0bec48732d191cd4e144b13b8faf5a203528799e93be7ac3154c6a8ead324  /tmp/perlivio-hd-media/stones.webp' | sha256sum -c -

      - name: Replace compressed site images
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/perlivio-hd-media/hero.webp assets/media/hero-lifestyle.webp
          cp /tmp/perlivio-hd-media/hero.webp assets/media/collections-overview.webp
          cp /tmp/perlivio-hd-media/argent.webp assets/media/bracelet-single-a.webp
          cp /tmp/perlivio-hd-media/argent.webp assets/media/packshot-argent.webp
          cp /tmp/perlivio-hd-media/essentiel.webp assets/media/bracelet-single-b.webp
          cp /tmp/perlivio-hd-media/essentiel.webp assets/media/packshot-essentiel.webp
          cp /tmp/perlivio-hd-media/signature.webp assets/media/bracelet-single-d.webp
          cp /tmp/perlivio-hd-media/signature.webp assets/media/packshot-signature.webp
          cp /tmp/perlivio-hd-media/metal.webp assets/media/bracelet-single-e.webp
          cp /tmp/perlivio-hd-media/metal.webp assets/media/packshot-metal.webp
          cp /tmp/perlivio-hd-media/inox.webp assets/media/packshot-inox.webp
          cp /tmp/perlivio-hd-media/reserve.webp assets/media/packshot-reserve.webp
          cp /tmp/perlivio-hd-media/reserve.webp assets/media/reserve-lifestyle.webp
          cp /tmp/perlivio-hd-media/stones.webp assets/media/stones-catalogue.webp
          rm -rf .hd-images-direct .hd-images-upload
          rm -f .github/workflows/upgrade-hd-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore high-resolution Perlivio imagery'
          git push origin HEAD:main
