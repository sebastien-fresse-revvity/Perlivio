name: Restore complete Perlivio site

on:
  pull_request:
    branches: [main]
    paths:
      - '.site-import/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Rebuild and validate archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/perlivio-full-site.tar.xz
          for f in $(find .site-import -maxdepth 1 -name 'chunk-*.b64' | sort); do
            base64 --decode "$f" >> /tmp/perlivio-full-site.tar.xz
          done
          echo 'a2cbcf9b9a8a73ec961a8b2b0b824a2f27eaeb9956814257f77791dbf788d15f  /tmp/perlivio-full-site.tar.xz' | sha256sum -c -
          xz -t /tmp/perlivio-full-site.tar.xz
          rm -rf /tmp/perlivio-site
          mkdir -p /tmp/perlivio-site
          tar -xJf /tmp/perlivio-full-site.tar.xz -C /tmp/perlivio-site
          test -f /tmp/perlivio-site/index.html
          test -f /tmp/perlivio-site/composer/index.html
          test -f /tmp/perlivio-site/pierres/index.html
          test -f /tmp/perlivio-site/faq/index.html

      - name: Replace main with complete site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/perlivio-site/. .
          rm -rf .bootstrap .site-import
          rm -f .github/workflows/import-site.yml .github/workflows/restore-full-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore complete Perlivio site'
          git push origin HEAD:main
