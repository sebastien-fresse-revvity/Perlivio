name: Inspect and restore Perlivio payload

on:
  pull_request:
    branches: [main]
    paths:
      - '.payload-inspect'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect existing payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/perlivio-pages.tar.gz
          for f in $(find .sitepayload2 -maxdepth 1 -name 'part-*.b64' | sort); do
            base64 --decode "$f" >> /tmp/perlivio-pages.tar.gz
          done
          gzip -t /tmp/perlivio-pages.tar.gz
          mkdir -p /tmp/payload
          tar -xzf /tmp/perlivio-pages.tar.gz -C /tmp/payload
          echo '--- archive files ---'
          find /tmp/payload -type f | sort
          echo '--- counts ---'
          echo "files=$(find /tmp/payload -type f | wc -l)"
          echo "pages=$(find /tmp/payload -name index.html | wc -l)"
          echo "bytes=$(du -sb /tmp/payload | cut -f1)"
          test -f /tmp/payload/index.html || true
          test -f /tmp/payload/pierres/index.html || true
          test -f /tmp/payload/faq/index.html || true
