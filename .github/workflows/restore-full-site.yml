name: Inspect and restore Perlivio payload

on:
  pull_request:
    branches: [main]
    paths:
      - '.payload-inspect'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect existing payload
        shell: bash
        run: |
          set -euo pipefail
          cat $(find .sitepayload2 -maxdepth 1 -name 'part-*.b64' | sort) > /tmp/perlivio-pages.b64
          len=$(wc -c < /tmp/perlivio-pages.b64)
          rem=$((len % 4))
          echo "combined base64 length=$len remainder=$rem"
          if [ "$rem" = "2" ]; then printf '==' >> /tmp/perlivio-pages.b64; fi
          if [ "$rem" = "3" ]; then printf '=' >> /tmp/perlivio-pages.b64; fi
          test "$rem" != "1"
          base64 --decode /tmp/perlivio-pages.b64 > /tmp/perlivio-pages.tar.gz
          gzip -t /tmp/perlivio-pages.tar.gz
          rm -rf /tmp/payload
          mkdir -p /tmp/payload
          tar -xzf /tmp/perlivio-pages.tar.gz -C /tmp/payload
          echo '--- archive files ---'
          find /tmp/payload -type f | sort
          echo '--- counts ---'
          echo "files=$(find /tmp/payload -type f | wc -l)"
          echo "pages=$(find /tmp/payload -name index.html | wc -l)"
          echo "bytes=$(du -sb /tmp/payload | cut -f1)"
