name: Restore complete Perlivio site

on:
  pull_request:
    branches: [main]
    paths:
      - '.site-import-v4/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Rebuild and validate complete site
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .site-import-v4 -maxdepth 1 -name 'chunk-*.b64' | wc -l)
          echo "Found $count payload chunks"
          test "$count" = "11"
          cat $(find .site-import-v4 -maxdepth 1 -name 'chunk-*.b64' | sort) | base64 --decode > /tmp/perlivio-site.tar.xz
          echo 'ca9cec5d7253d2d15f7e7a14e09c5e29f69dea4c85949b9d7b95de6d6565e022  /tmp/perlivio-site.tar.xz' | sha256sum -c -
          xz -t /tmp/perlivio-site.tar.xz
          rm -rf /tmp/perlivio-site
          mkdir -p /tmp/perlivio-site
          tar -xJf /tmp/perlivio-site.tar.xz -C /tmp/perlivio-site
          test -f /tmp/perlivio-site/index.html
          test -f /tmp/perlivio-site/composer/index.html
          test -f /tmp/perlivio-site/pierres/index.html
          test -f /tmp/perlivio-site/faq/index.html
          test -f /tmp/perlivio-site/collections/essentiel/index.html
          test -f /tmp/perlivio-site/notre-histoire/index.html
          pages=$(find /tmp/perlivio-site -name index.html | wc -l)
          files=$(find /tmp/perlivio-site -type f | wc -l)
          echo "Validated $pages pages / $files files"
          test "$pages" -ge "45"
          test "$files" -ge "90"

      - name: Replace main with complete site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/perlivio-site/. .
          rm -rf .bootstrap .sitepayload2 .site-import .site-import-v2 .site-import-v3 .site-import-v4
          rm -f .github/workflows/import-site.yml .github/workflows/restore-full-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore complete Perlivio site'
          git push origin HEAD:main
