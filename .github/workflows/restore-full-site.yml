name: Restore complete Perlivio site

on:
  pull_request:
    branches: [main]
    paths:
      - '.site-import-clean/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Rebuild and validate complete site
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .site-import-clean -maxdepth 1 -name 'chunk-*.b64' | wc -l)
          echo "Found $count clean chunks"
          test "$count" = "4"
          cat $(find .site-import-clean -maxdepth 1 -name 'chunk-*.b64' | sort) | base64 --decode > /tmp/perlivio-site.tar.xz
          echo 'af710d910dc0d0e11548b9f00cf38ea21bdf542bbdb57b658871c759c09e7319  /tmp/perlivio-site.tar.xz' | sha256sum -c -
          xz -t /tmp/perlivio-site.tar.xz
          rm -rf /tmp/perlivio-site
          mkdir -p /tmp/perlivio-site
          tar -xJf /tmp/perlivio-site.tar.xz -C /tmp/perlivio-site
          test -f /tmp/perlivio-site/index.html
          test -f /tmp/perlivio-site/composer/index.html
          test -f /tmp/perlivio-site/pierres/index.html
          test -f /tmp/perlivio-site/faq/index.html
          test -f /tmp/perlivio-site/collections/essentiel/index.html
          test -f /tmp/perlivio-site/collections/metal/index.html
          test -f /tmp/perlivio-site/collections/inox/index.html
          test -f /tmp/perlivio-site/collections/argent/index.html
          test -f /tmp/perlivio-site/collections/signature/index.html
          test -f /tmp/perlivio-site/notre-histoire/index.html
          pages=$(find /tmp/perlivio-site -name index.html | wc -l)
          files=$(find /tmp/perlivio-site -type f | wc -l)
          echo "Validated $pages pages / $files text files"
          test "$pages" = "47"
          test "$files" = "55"

      - name: Replace main with complete site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main site-assets
          git show origin/main:composer/index.html > /tmp/composer-corrected.html
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/perlivio-site/. .
          cp /tmp/composer-corrected.html composer/index.html
          git checkout origin/site-assets -- assets/beads assets/media
          rm -rf .bootstrap .sitepayload2 .site-import .site-import-v2 .site-import-v3 .site-import-v4 .site-import-final .site-import-clean
          rm -f COMMIT_OK.txt STATUS.md
          rm -f .github/workflows/import-site.yml .github/workflows/restore-full-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore complete Perlivio site'
          git push origin HEAD:main
